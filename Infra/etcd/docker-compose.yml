version: '3'
services:
  etcd1:
    image: quay.io/coreos/etcd:latest
    command: etcd --name etcd1 --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd1:2379 --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd1:2380 --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380 --initial-cluster-token token --initial-cluster-state new
    ports: ["2379:2379"]
  etcd2:
    image: quay.io/coreos/etcd:latest
    command: etcd --name etcd2 --listen-client-urls http://0.0.0.0:22379 --advertise-client-urls http://etcd2:22379 --listen-peer-urls http://0.0.0.0:22380 --initial-advertise-peer-urls http://etcd2:22380 --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:22380,etcd3=http://etcd3:2380 --initial-cluster-token token --initial-cluster-state new
    ports: ["22379:22379"]
  etcd3:
    image: quay.io/coreos/etcd:latest
    command: etcd --name etcd3 --listen-client-urls http://0.0.0.0:32379 --advertise-client-urls http://etcd3:32379 --listen-peer-urls http://0.0.0.0:32380 --initial-advertise-peer-urls http://etcd3:32380 --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:22380,etcd3=http://etcd3:32380 --initial-cluster-token token --initial-cluster-state new
    ports: ["32379:32379"]

# docker-compose up -d # 后台启动
# docker-compose down

# docker stop etcd1  # 杀一个
# docker start etcd1 # 恢复